name: Publish rehearsal (dry run)

# TEMPORARY. Rehearses publish.yml from a manual dispatch on main, before the
# release tag exists: same build job (pack and upload before npm ci), same
# artifact hand-off by id and digest check, but no OIDC token, no "npm"
# environment and npm publish --dry-run at the end. npm 12 refuses the dry run
# if the version is already on the registry, so run it after the version bump.
# Delete this file after the rehearsal.
on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Derive the release tag this commit would need
        id: tag
        run: |
          echo "name=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Pack the release tarball before installing any dependency
        id: pack
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          tarball="oveyon-nodemailer-transport-${RELEASE_TAG#v}.tgz"
          mkdir release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          test -f "release-artifacts/$tarball"
          sha256="$(sha256sum "release-artifacts/$tarball" | cut -d ' ' -f 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Release tarball $tarball sha256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-tarball
          path: release-artifacts/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run pack:check

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts
      - name: Check the tarball against the digest taken before npm ci
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          files=(release-artifacts/*)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "release-artifacts/$TARBALL"
          echo "$SHA256  release-artifacts/$TARBALL" | sha256sum --check --strict
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Dry run only, nothing is sent to the registry
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./release-artifacts/$TARBALL" --dry-run --access public --ignore-scripts
